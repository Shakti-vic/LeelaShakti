<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05031a"/>
      <stop offset="0.45" stop-color="#160a3d"/>
      <stop offset="0.8" stop-color="#2a0f52"/>
      <stop offset="1" stop-color="#1a0833"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cfe3ff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#9b7bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e6ff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#8fb0ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6a4fd6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset="0.5" stop-color="#1b1045"/>
      <stop offset="1" stop-color="#0c0624"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b9a8ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ganga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe8ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#9fe8ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>

  <g filter="url(#blur)">
    <ellipse cx="260" cy="260" rx="320" ry="220" fill="#c2188b" opacity="0.45"/>
    <ellipse cx="1360" cy="230" rx="340" ry="240" fill="#1e5bff" opacity="0.45"/>
    <ellipse cx="1180" cy="780" rx="360" ry="200" fill="#00b3c7" opacity="0.28"/>
    <ellipse cx="420" cy="820" rx="360" ry="220" fill="#7b2cff" opacity="0.4"/>
    <ellipse cx="800" cy="360" rx="380" ry="260" fill="#ff6fb5" opacity="0.18"/>
  </g>

  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.2" opacity="0.8"/>
    <circle cx="150" cy="190" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="90" r="1" opacity="0.6"/>
    <circle cx="330" cy="320" r="1.3" opacity="0.7"/>
    <circle cx="420" cy="140" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="60" r="1" opacity="0.7"/>
    <circle cx="590" cy="250" r="1.4" opacity="0.6"/>
    <circle cx="680" cy="110" r="1.1" opacity="0.8"/>
    <circle cx="760" cy="40" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="160" r="1.2" opacity="0.7"/>
    <circle cx="960" cy="70" r="1" opacity="0.6"/>
    <circle cx="1050" cy="230" r="1.5" opacity="0.8"/>
    <circle cx="1140" cy="110" r="2.1"><animate attributeName="opacity" values="1;0.2;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1230" cy="40" r="1.1" opacity="0.7"/>
    <circle cx="1320" cy="300" r="1.3" opacity="0.6"/>
    <circle cx="1410" cy="120" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="1500" cy="60" r="1" opacity="0.8"/>
    <circle cx="1550" cy="240" r="1.4" opacity="0.6"/>
    <circle cx="60" cy="420" r="1.2" opacity="0.6"/>
    <circle cx="200" cy="520" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="1480" cy="460" r="1.5" opacity="0.7"/>
    <circle cx="1380" cy="560" r="1.1" opacity="0.6"/>
    <circle cx="1560" cy="620" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="640" r="1" opacity="0.6"/>
    <circle cx="640" cy="420" r="1.2" opacity="0.5"/>
    <circle cx="980" cy="440" r="1.3" opacity="0.5"/>
  </g>

  <circle cx="800" cy="300" r="300" fill="url(#aura)"/>
  <g fill="none" stroke="#e8dcff" stroke-opacity="0.12">
    <circle cx="800" cy="300" r="160"/>
    <circle cx="800" cy="300" r="230"/>
    <circle cx="800" cy="300" r="300" stroke-dasharray="4 10"/>
  </g>

  <path d="M0 1000 L0 800 L160 720 L300 770 L470 640 L620 560 L800 380 L980 560 L1130 640 L1300 760 L1440 700 L1600 780 L1600 1000 Z" fill="url(#mountain)"/>
  <path d="M800 380 L735 445 L765 438 L790 462 L812 440 L838 458 L865 445 Z" fill="url(#snow)"/>
  <path d="M470 640 L440 668 L462 664 L478 676 L500 662 Z" fill="url(#snow)" opacity="0.6"/>
  <path d="M1130 640 L1102 666 L1124 662 L1140 674 L1160 662 Z" fill="url(#snow)" opacity="0.6"/>
  <path d="M0 1000 L0 880 L220 820 L420 870 L600 800 L800 860 L1000 800 L1200 870 L1400 820 L1600 880 L1600 1000 Z" fill="#090418" opacity="0.85"/>

  <g transform="translate(470 120) scale(1.65)" filter="url(#soft)">
    <path d="M200 24 C222 24 226 52 222 70 C246 60 232 30 212 18" fill="none" stroke="url(#ganga)" stroke-width="4"/>
    <path d="M214 40 C260 60 270 120 300 170 C320 205 330 260 360 300" fill="none" stroke="url(#ganga)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="200" cy="30" r="13" fill="url(#figure)"/>
    <ellipse cx="200" cy="54" rx="28" ry="24" fill="url(#figure)"/>
    <circle cx="200" cy="100" r="40" fill="url(#figure)"/>
    <path d="M180 38 A16 16 0 1 0 196 22 A12 12 0 1 1 180 38 Z" fill="#fff4cf" opacity="0.75"/>
    <ellipse cx="200" cy="88" rx="3" ry="7" fill="#ffd98a" opacity="0.7"/>
    <path d="M182 136 L218 136 L222 152 C262 158 292 172 300 205 L312 268 C318 300 326 330 340 352 C380 362 396 392 380 420 C350 455 260 468 200 468 C140 468 50 455 20 420 C4 392 20 362 60 352 C74 330 82 300 88 268 L100 205 C108 172 138 158 178 152 Z" fill="url(#figure)"/>
    <path d="M150 162 C170 190 230 190 250 162" fill="none" stroke="#bfe0ff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <circle cx="250" cy="160" r="6" fill="#bfe0ff" opacity="0.35"/>
    <circle cx="70" cy="384" r="16" fill="#e5efff" opacity="0.2"/>
    <circle cx="330" cy="384" r="16" fill="#e5efff" opacity="0.2"/>
  </g>

  <g transform="translate(1180 170)" stroke="#e8dcff" stroke-opacity="0.32" fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M0 0 V640"/>
    <path d="M-48 10 C-48 70 -20 92 0 96 C20 92 48 70 48 10"/>
    <path d="M0 -24 V96"/>
    <path d="M-48 10 L-56 -8 M48 10 L56 -8 M0 -24 L0 -40"/>
    <path d="M-22 170 L22 200 L-22 230 L22 260" stroke-opacity="0.22" stroke-width="3"/>
    <path d="M-26 186 L26 186 M-26 244 L26 244" stroke-opacity="0.22" stroke-width="3"/>
  </g>
</svg>
